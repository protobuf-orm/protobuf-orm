edition = "2023";

package graphtest;

import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message ErasedNotTime {
  int32 id = 1 [(orm.field) = {key: true}];

  // Only a time can say when a row was erased.
  string erased_at = 2 [(orm.field) = {erased: {}}];

  option (orm.message) = {};
}
