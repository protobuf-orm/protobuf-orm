edition = "2023";

package graphtest;

import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message IndexIncludesErasedWoErased {
  int32 id = 1 [(orm.field) = {key: true}];
  string alias = 2 [(orm.field) = {}];

  option (orm.message) = {
    indexes: [
      // Nothing is ever erased here, so there is nothing to include.
      {
        name: "alias"
        refs: [
          {
            name: "alias"
            number: 2
          }
        ]
        unique: true
        includes_erased: true
      }
    ]
  };
}
