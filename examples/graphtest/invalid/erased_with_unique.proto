edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message ErasedWithUnique {
  int32 id = 1 [(orm.field) = {key: true}];

  // Two rows erased in the same instant are two rows, not a conflict.
  google.protobuf.Timestamp erased_at = 2 [(orm.field) = {
    erased: {}
    unique: true
  }];

  option (orm.message) = {};
}
