edition = "2023";

package graphtest;

import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message IndexNoRef {
  int32 id = 1 [(orm.field) = {key: true}];
  string name = 2 [(orm.field) = {}];

  // An index must reference at least one prop.
  option (orm.message) = {
    indexes: [
      {name: "empty"}
    ]
  };
}
