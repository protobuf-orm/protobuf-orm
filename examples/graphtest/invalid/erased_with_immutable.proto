edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message ErasedWithImmutable {
  int32 id = 1 [(orm.field) = {key: true}];

  // The server stamps it, so it is the one thing it cannot be.
  google.protobuf.Timestamp erased_at = 2 [(orm.field) = {
    erased: {}
    immutable: true
  }];

  option (orm.message) = {};
}
