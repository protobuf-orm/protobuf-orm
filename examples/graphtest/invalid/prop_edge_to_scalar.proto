edition = "2023";

package graphtest;

import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message PropEdgeToScalar {
  int32 id = 1 [(orm.field) = {key: true}];

  // An edge must reference a message (an entity), but this is a scalar field.
  int32 entity = 2 [(orm.edge) = {}];

  option (orm.message) = {};
}
