edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message ErasedNotNullable {
  int32 id = 1 [(orm.field) = {key: true}];

  // Being null is how it says the row is still there.
  google.protobuf.Timestamp erased_at = 2 [(orm.field) = {
    erased: {}
    nullable: false
  }];

  option (orm.message) = {};
}
