edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message VersionWithUnique {
  int32 id = 1 [(orm.field) = {key: true}];

  // A version field cannot also be unique, nullable, or immutable.
  google.protobuf.Timestamp updated_at = 2 [(orm.field) = {
    version: {}
    unique: true
  }];

  option (orm.message) = {};
}
