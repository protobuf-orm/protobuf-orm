edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message VersionMany {
  int32 id = 1 [(orm.field) = {key: true}];

  // A server stamps the one version field it is given, so a second would sit
  // frozen at whatever Add wrote while still demanding a value on every patch
  // -- a lock that always passes its own compare-and-swap.
  google.protobuf.Timestamp updated_at = 2 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp touched_at = 3 [(orm.field) = {version: {}}];

  option (orm.message) = {};
}
