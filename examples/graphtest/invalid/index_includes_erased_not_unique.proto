edition = "2023";

package graphtest;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message IndexIncludesErasedNotUnique {
  int32 id = 1 [(orm.field) = {key: true}];

  google.protobuf.Timestamp erased_at = 2 [(orm.field) = {erased: {}}];
  string alias = 3 [(orm.field) = {}];

  option (orm.message) = {
    indexes: [
      // Nothing to say: only uniqueness is a problem an erased row causes.
      {
        name: "alias"
        refs: [
          {
            name: "alias"
            number: 3
          }
        ]
        includes_erased: true
      }
    ]
  };
}
