edition = "2023";

package graphtest;

import "orm.proto";

option go_package = "github.com/protobuf-orm/protobuf-orm/internal/examples/graphtest";

message RpcEnabled {
  int32 id = 1 [(orm.field) = {key: true}];

  // RPC is enabled if `orm.message.rpc.*` is defined.
  option (orm.message) = {
    rpc: {
      add: {}
    }
  };
}

message RpcAll {
  int32 id = 1 [(orm.field) = {key: true}];

  // Each verb is named, and these are all five of them.
  option (orm.message) = {
    rpc: {
      add: {}
      get: {}
      patch: {}
      apply: {}
      erase: {}
    }
  };
}

message RpcAddDisabled {
  int32 id = 1 [(orm.field) = {key: true}];

  // A verb that is named and disabled is not there.
  option (orm.message) = {
    rpc: {
      add: {disabled: true}
      get: {}
      patch: {}
      erase: {}
    }
  };
}

message RpcPatchAlone {
  int32 id = 1 [(orm.field) = {key: true}];

  // Patch does not bring Apply.
  option (orm.message) = {
    rpc: {
      patch: {}
    }
  };
}

message RpcApplyAlone {
  int32 id = 1 [(orm.field) = {key: true}];

  // Nor does Apply need Patch.
  option (orm.message) = {
    rpc: {
      apply: {}
    }
  };
}

message RpcApplyDisabled {
  int32 id = 1 [(orm.field) = {key: true}];

  // An Apply that is disabled is not there, Patch or no Patch.
  option (orm.message) = {
    rpc: {
      patch: {}
      apply: {disabled: true}
    }
  };
}

message RpcEmpty {
  int32 id = 1 [(orm.field) = {key: true}];

  // An `orm.message.rpc` that names no verb has none.
  option (orm.message) = {
    rpc: {}
  };
}

message RpcDisabled {
  int32 id = 1 [(orm.field) = {key: true}];

  // No `orm.message.rpc.*` so no RPCs are enabled.
  option (orm.message) = {};
}

message RpcDisabledExplicit {
  int32 id = 1 [(orm.field) = {key: true}];

  // Although `orm.message.rpc.*` is defined, the `orm.message.rpc.disabled` is set by `true`,
  // so the RPC is not enabled.
  option (orm.message) = {
    rpc: {
      disabled: true
      add: {}
    }
  };
}

message RpcAddMany {
  int32 id = 1 [(orm.field) = {key: true}];

  // AddMany is enabled beside Add by `orm.message.rpc.add.many`.
  option (orm.message) = {
    rpc: {
      add: {many: {}}
    }
  };
}

message RpcAddManyMax {
  int32 id = 1 [(orm.field) = {key: true}];

  // And it carries at most `max` items.
  option (orm.message) = {
    rpc: {
      add: {
        many: {max: 50}
      }
    }
  };
}

message RpcAddManyWithoutAdd {
  int32 id = 1 [(orm.field) = {key: true}];

  // An Add that is disabled takes its AddMany with it.
  option (orm.message) = {
    rpc: {
      add: {
        disabled: true
        many: {}
      }
      get: {}
      patch: {}
      erase: {}
    }
  };
}
